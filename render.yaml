# Render Blueprint (infrastructure-as-code) for the Frectangles backend.
#
# One-time setup in Render: New > Blueprint > connect this repo. Render reads
# this file, builds the API from backend/Dockerfile, provisions a managed
# Postgres, and injects DATABASE_URL automatically. No manual env wiring.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: frectangles-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://frectangles.com
      - key: DATABASE_URL
        fromDatabase:
          name: frectangles-db
          property: connectionString

databases:
  - name: frectangles-db
    plan: free
